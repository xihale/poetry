<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竖排剧场</title>
<style>
  :root{
    --bg:#0A0908;
    --ink:#EDE6DA;
    --ash:#7A7167;
    --ash-deep:#453F38;
    --ember:#E8552B;
    --line:#26221E;
    --kai:"LXGW WenKai","霞鹜文楷","Kaiti SC","STKaiti",KaiTi,serif;
    --song:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",SimSun,serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    color:var(--ink);
    font-family:var(--song);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .vtext{writing-mode:vertical-rl;text-orientation:upright;}

  /* ---------- top bar ---------- */
  .bar{
    display:flex;justify-content:space-between;align-items:center;
    padding:22px 30px;
    font-family:var(--kai);font-size:12px;letter-spacing:.3em;
    color:var(--ash);
    border-bottom:1px solid var(--line);
  }
  .bar .dot{color:var(--ember);}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    min-height:74vh;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    padding:0 30px;
    overflow:hidden;
  }
  .hero-glow{
    position:absolute;left:-10%;bottom:-40%;
    width:120%;height:80%;
    background:radial-gradient(ellipse at 30% 100%, rgba(232,85,43,.30), rgba(232,85,43,.06) 45%, transparent 70%);
    pointer-events:none;
  }
  .hero-left{
    position:relative;
    display:flex;align-items:center;justify-content:flex-end;gap:40px;
    padding:56px 48px 56px 0;
  }
  .excerpt-col{
    display:flex;gap:34px;
    font-family:var(--kai);
    font-size:clamp(15px,1.25vw,19px);
    line-height:1.15;
    letter-spacing:.32em;
    color:var(--ash);
  }
  .excerpt-col p{margin:0;}
  .excerpt-col p.hi{color:#C9C0B2;}
  .hero-index{
    position:absolute;left:30px;bottom:36px;
    font-family:var(--kai);font-size:12px;letter-spacing:.28em;color:var(--ash);
  }
  .hero-index b{color:var(--ink);font-weight:400;}
  .hero-right{
    position:relative;
    display:flex;align-items:center;justify-content:flex-end;
    padding:40px 0 40px 20px;
  }
  .hero-title{
    font-family:var(--kai);
    font-size:clamp(88px,15vw,210px);
    line-height:1;
    letter-spacing:.12em;
    margin:0;font-weight:400;
    background:linear-gradient(178deg,#FFF4E8 6%,#EDE6DA 38%,#B9AE9E 78%,#7A7167 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 60px rgba(232,85,43,.10);
  }
  .hero-title .ember{
    background:linear-gradient(180deg,#FFC59B,#E8552B 55%,#8E2C12);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* ---------- strip index ---------- */
  .rack{
    display:flex;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    height:34vh;min-height:260px;
  }
  .strip{
    flex:1 1 0;
    position:relative;
    border-right:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    padding:26px 0;
    transition:background-color .3s ease,flex-grow .35s cubic-bezier(.2,.7,.3,1);
    cursor:pointer;
    overflow:hidden;
  }
  .strip:last-child{border-right:none;}
  .strip .num{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-family:var(--kai);font-size:11px;letter-spacing:.18em;color:var(--ash-deep);
    transition:color .3s ease;
  }
  .strip .t{
    font-family:var(--kai);
    font-size:clamp(15px,1.35vw,21px);
    letter-spacing:.2em;
    color:#A79E92;
    transition:color .3s ease,letter-spacing .3s ease;
    white-space:nowrap;
  }
  .strip:hover{background:#120F0C;flex-grow:1.7;}
  .strip:hover .t{color:var(--ink);letter-spacing:.3em;}
  .strip:hover .num{color:var(--ember);}
  .strip.feat .t{color:var(--ink);}
  .strip.feat::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--ember),transparent);
  }
  .rack-cap{
    display:flex;justify-content:space-between;
    padding:14px 30px 0;
    font-family:var(--kai);font-size:11px;letter-spacing:.24em;color:var(--ash-deep);
  }
  @media (max-width:820px){
    .hero{grid-template-columns:1fr;min-height:auto;padding:0 20px 30px;}
    .hero-left{padding:30px 0 0;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:18px;}
    .excerpt-col{font-size:13px;letter-spacing:.22em;gap:18px;}
    .excerpt-col p{line-height:1.9;}
    .hero-index{position:static;order:3;letter-spacing:.2em;}
    .hero-right{padding:22px 0 0;justify-content:flex-start;}
    .hero-title{font-size:clamp(64px,22vw,104px);letter-spacing:.08em;}
    .rack{overflow-x:auto;height:auto;min-height:0;scrollbar-width:none;}
    .strip{flex:0 0 66px;height:290px;}
    .rack-cap{padding:14px 20px 0;}
    .bar{font-size:11px;letter-spacing:.22em;padding:18px 20px;}
  }
</style>
</head>
<body>
  <div class="bar">
    <div>诗&nbsp;存 &nbsp;<span class="dot">·</span>&nbsp; XIHALE</div>
    <div>十三篇 &nbsp;<span class="dot">·</span>&nbsp; 2022—2026</div>
  </div>

  <section class="hero">
    <div class="hero-glow"></div>
    <div class="hero-left">
      <div class="excerpt-col">
        <p>有的人活着，</p>
        <p>他或将继续苟活；</p>
        <p class="hi">有的人死了，</p>
        <p>他早在是之前就死了。</p>
      </div>
      <div class="hero-index">最新 &nbsp;<b>12</b> &nbsp;·&nbsp; 4.18 &nbsp;·&nbsp; 三十四行</div>
    </div>
    <div class="hero-right">
      <h1 class="hero-title vtext">死与<span class="ember">生</span></h1>
    </div>
  </section>

  <div class="rack-cap">
    <span>按 时 间 倒 序</span>
    <span>点 标 题 通 读 全 文</span>
  </div>
  <nav class="rack">
    <div class="strip feat"><span class="num">12</span><span class="t vtext">死与生</span></div>
    <div class="strip"><span class="num">11</span><span class="t vtext">绿色与褐色</span></div>
    <div class="strip"><span class="num">10</span><span class="t vtext">四年前的雨</span></div>
    <div class="strip"><span class="num">09</span><span class="t vtext">爱恨</span></div>
    <div class="strip"><span class="num">08</span><span class="t vtext">爱恨</span></div>
    <div class="strip"><span class="num">07</span><span class="t vtext">逝</span></div>
    <div class="strip"><span class="num">06</span><span class="t vtext">寄出的明信片</span></div>
    <div class="strip"><span class="num">05</span><span class="t vtext">是否应该让井底之蛙看到天地之大？</span></div>
    <div class="strip"><span class="num">04</span><span class="t vtext">天空与星</span></div>
    <div class="strip"><span class="num">03</span><span class="t vtext">蔽月山房</span></div>
    <div class="strip"><span class="num">02</span><span class="t vtext">刺刀与甲</span></div>
    <div class="strip"><span class="num">01</span><span class="t vtext">雨与磁针</span></div>
    <div class="strip"><span class="num">00</span><span class="t vtext">刺刀与风</span></div>
  </nav>
</body>
</html>
